[package]
name = "webgis-toolbox"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
webgis-core = { path = "crates/core", features = ["model-clip"] }
tiles-toolbox = { path = "crates/tiles" }
anyhow = "1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libloading = "0.8"
quick-xml = "0.41"
regex = "1"
rstar = "0.12"
rustix = { version = "1", features = ["fs"] }
tempfile = "3"
walkdir = "2"

[workspace]
members = ["crates/core", "crates/tiles"]
resolver = "3"
