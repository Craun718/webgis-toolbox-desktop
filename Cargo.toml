[package]
name = "webgis-toolbox"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Craun718"]
repository = "https://github.com/Craun718/webgis-toolbox-desktop"

[dependencies]
dirs = "6"
ctb-rs = { path = "vendor/ctb-rs" }
rayon = "1.12"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
webgis-core = { path = "crates/core", features = ["model-clip"] }
tiles-toolbox = { path = "crates/tiles" }
anyhow = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
crs-definitions = { version = "0.4", default-features = false, features = ["proj4"] }
proj4rs = { version = "0.1.10", default-features = false }
flate2 = "1"
tiff = { version = "0.11.3", default-features = false, features = ["deflate", "lzw", "jpeg"] }
weezl = "0.1.12"
quick-xml = "0.41"
regex = "1"
rstar = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
tempfile = "3"
walkdir = "2"
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
pollster = "0.4"

[workspace]
members = ["crates/core", "crates/tiles"]
exclude = ["vendor/ctb-rs"]
resolver = "3"
