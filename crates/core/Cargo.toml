[package]
name = "webgis-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
model-clip = [
  "dep:geo",
  "dep:rstar",
  "dep:serde_json",
  "dep:shapefile",
  "dep:zip",
  "dep:quick-xml",
  "dep:proj4rs",
  "dep:proj4wkt",
  "dep:tempfile",
  "dep:rustix",
]

[dependencies]
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
geo = { version = "0.33", default-features = false, features = ["spade"], optional = true }
rstar = { version = "0.12", optional = true }
serde_json = { version = "1", optional = true }
shapefile = { version = "0.7", features = ["geo-types"], optional = true }
zip = { version = "9.7.3", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.41", optional = true }
proj4rs = { version = "0.1.10", default-features = false, features = ["crs-definitions", "multi-thread"], optional = true }
proj4wkt = { version = "0.1.1", optional = true }
tempfile = { version = "3", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"], optional = true }
