name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: target/release/webgis-toolbox
          - name: windows-x86_64
            os: windows-latest
            binary: target/release/webgis-toolbox.exe
          - name: macos-arm64
            os: macos-latest
            binary: target/release/webgis-toolbox
    env:
      GIT_LFS_SKIP_SMUDGE: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Test CJK font loading
        run: cargo test --release --locked --bin webgis-toolbox app::fonts::tests

      - name: Prepare distribution
        shell: bash
        run: |
          mkdir -p dist/fonts
          cp "${{ matrix.binary }}" dist/
          cp fonts/*.otf fonts/OFL.txt dist/fonts/

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: webgis-toolbox-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
